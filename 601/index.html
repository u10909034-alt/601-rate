<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>601 Racing Game</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Noto+Sans+TC:wght@700;900&display=swap');

  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Orbitron', 'Noto Sans TC', sans-serif;
    background: #0B0E14;
    color: #F0F4F8;
    background-image: 
      linear-gradient(135deg, rgba(230, 0, 38, 0.05) 0%, transparent 40%),
      radial-gradient(circle at 80% 20%, rgba(0, 180, 216, 0.08) 0%, transparent 50%),
      repeating-linear-gradient(45deg, #0d121d 0, #0d121d 10px, #0b0e14 10px, #0b0e14 20px);
    min-height: 100vh;
  }
  
  .app {
    max-width: 1280px;
    margin: auto;
    padding: 20px;
  }

  .header-container {
    text-align: center;
    position: relative;
    margin-bottom: 20px;
    padding: 10px 0;
  }
  
  h1 {
    margin: 0;
    font-size: 38px;
    font-weight: 900;
    letter-spacing: 2px;
    font-style: italic;
    background: linear-gradient(90deg, #FF2E55, #FFFFFF, #00D2FF);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-transform: uppercase;
    text-shadow: 0 0 20px rgba(255, 46, 85, 0.3);
  }

  .subtitle {
    color: #8A99AD;
    font-size: 14px;
    margin-top: 6px;
    font-family: 'Noto Sans TC', sans-serif;
    letter-spacing: 1px;
  }

  .layout {
    display: grid;
    grid-template-columns: 1fr 340px;
    gap: 20px;
  }

  .board, .panel {
    background: rgba(18, 24, 38, 0.85);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), inset 0 0 0 1px rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(10px);
  }

  .board { padding: 16px; }

  .track {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }

  .cell {
    height: 80px;
    border: 1px solid #1E293B;
    border-radius: 10px;
    background: #111726;
    position: relative;
    padding: 6px;
    font-weight: 800;
    transition: all 0.2s ease;
    clip-path: polygon(0 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%);
  }

  .cell.start {
    background: linear-gradient(135deg, rgba(16, 185, 129, 0.2), #111726);
    border-color: #10B981;
  }

  .cell.finish {
    background: linear-gradient(135deg, rgba(245, 158, 11, 0.25), #111726);
    border-color: #F59E0B;
  }

  .num {
    font-size: 12px;
    color: #475569;
    font-style: italic;
  }

  .cars {
    position: absolute;
    left: 4px;
    right: 4px;
    bottom: 4px;
    display: flex;
    gap: 2px;
    flex-wrap: wrap;
  }

  .car {
    font-size: 22px;
    line-height: 1;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.8));
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .winner {
    animation: speed-pop 0.5s infinite alternate;
  }

  @keyframes speed-pop {
    to { transform: scale(1.25) translateY(-2px); }
  }

  .panel { padding: 18px; }

  .teams {
    display: grid;
    gap: 8px;
  }

  .team {
    border: 1px solid #1E293B;
    border-radius: 10px;
    padding: 10px;
    background: #161F30;
    cursor: pointer;
    transition: all 0.2s ease;
    position: relative;
    overflow: hidden;
  }

  .team:hover {
    border-color: #334155;
    background: #1C273C;
  }

  .team.active {
    border-color: #FF2E55;
    background: linear-gradient(90deg, rgba(255, 46, 85, 0.15), #161F30);
    box-shadow: 0 0 15px rgba(255, 46, 85, 0.2);
  }

  .team.active::before {
    content: '';
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 4px;
    background: #FF2E55;
  }

  .teamrow {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .teamname {
    font-weight: 900;
    font-size: 15px;
    color: #F8FAFC;
    font-family: 'Noto Sans TC', sans-serif;
  }

  .pos {
    font-size: 13px;
    color: #00D2FF;
    font-weight: 700;
  }

  .controls {
    margin-top: 16px;
    display: grid;
    gap: 10px;
  }

  button {
    border: 0;
    border-radius: 8px;
    padding: 12px 10px;
    font-size: 15px;
    font-weight: 900;
    cursor: pointer;
    color: white;
    font-style: italic;
    transition: all 0.15s ease;
    text-transform: uppercase;
  }

  .moveBtns {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }

  .moveBtns button {
    background: linear-gradient(135deg, #1E293B, #0F172A);
    border: 1px solid #334155;
    color: #00D2FF;
    text-shadow: 0 0 8px rgba(0, 210, 255, 0.4);
  }

  .moveBtns button:hover {
    background: linear-gradient(135deg, #00D2FF, #0077FF);
    color: #FFF;
    border-color: #00D2FF;
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(0, 210, 255, 0.3);
  }

  .reset {
    background: linear-gradient(135deg, #DC2626, #991B1B);
    border: 1px solid #EF4444;
    margin-top: 4px;
  }

  .reset:hover {
    background: linear-gradient(135deg, #EF4444, #DC2626);
    box-shadow: 0 4px 12px rgba(239, 68, 68, 0.4);
    transform: translateY(-2px);
  }

  .status {
    text-align: center;
    margin: 14px 0 10px;
    padding: 12px;
    border-radius: 10px;
    background: #0F172A;
    border: 1px solid #1E293B;
    font-weight: 700;
    font-size: 14px;
    color: #F1F5F9;
    min-height: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Noto Sans TC', sans-serif;
  }

  /* 歷史加分紀錄區 */
  .log-container {
    background: #0B0E14;
    border: 1px solid #1E293B;
    border-radius: 10px;
    padding: 8px 10px;
    max-height: 120px;
    overflow-y: auto;
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 12px;
  }

  .log-title {
    font-size: 11px;
    color: #64748B;
    margin-bottom: 4px;
    font-weight: bold;
    display: flex;
    justify-content: space-between;
  }

  .log-item {
    padding: 3px 0;
    border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    color: #94A3B8;
  }

  .log-item:last-child {
    border-bottom: none;
  }

  .legend {
    font-size: 12px;
    color: #64748B;
    line-height: 1.6;
    margin-top: 12px;
    font-family: 'Noto Sans TC', sans-serif;
    border-top: 1px dashed #1E293B;
    padding-top: 10px;
  }

  @media(max-width:850px){
    .layout{ grid-template-columns:1fr; }
    .cell{ height:64px; }
    .car{ font-size:18px; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="header-container">
    <h1>🏎️ 601 RACING GAME</h1>
    <div class="subtitle">36 格 · 6 組競速｜自動存檔紀錄，重新整理不會消失！</div>
  </div>

  <div class="layout">
    <section class="board">
      <div id="track" class="track"></div>
    </section>

    <aside class="panel">
      <div class="teams" id="teams"></div>
      <div class="status" id="status">請選擇一組開始！</div>

      <div class="log-title">
        <span>📜 歷程紀錄 (自動儲存)</span>
      </div>
      <div class="log-container" id="logs">
        <div class="log-item">無歷史紀錄</div>
      </div>

      <div class="controls">
        <div class="moveBtns">
          <button onclick="moveSelected(1)">+1</button>
          <button onclick="moveSelected(2)">+2</button>
          <button onclick="moveSelected(3)">+3</button>
          <button onclick="moveSelected(4)">+4</button>
          <button onclick="moveSelected(5)">+5</button>
          <button onclick="moveSelected(6)">+6</button>
        </div>
        <button class="reset" onclick="resetGame()">🔄 重置比賽 (NEW GAME)</button>
      </div>

      <div class="legend">
        💡 <b>玩法說明：</b><br>
        1. 選擇隊伍後點擊按鈕 (+1 ~ +6)<br>
        2. 踏上神秘格會隨機觸發加速或後退<br>
        3. 所有數據皆自動保存在瀏覽器中
      </div>
    </aside>
  </div>
</div>

<script>
const emojis = ["🏎️", "🏎️", "🏍️", "🏎️", "🚀", "🏁"];
const names = ["Apex Red", "Nitro Blue", "Speed Moto", "Viper Yellow", "Rocket Neon", "Pace Leader"];
const specialCells = [5, 9, 13, 17, 21, 24, 28, 31, 34];

let pos = [0,0,0,0,0,0];
let selected = 0;
let gameOver = false;
let logs = [];

// 存檔 Key 鍵名
const STORAGE_KEY = "601_racing_game_save";

// 載入存檔
function loadGameData(){
  const saved = localStorage.getItem(STORAGE_KEY);
  if(saved){
    try {
      const data = JSON.parse(saved);
      pos = data.pos || [0,0,0,0,0,0];
      selected = data.selected || 0;
      gameOver = data.gameOver || false;
      logs = data.logs || [];
    } catch(e) {
      console.error("載入存檔失敗", e);
    }
  }
}

// 儲存遊戲資料
function saveGameData(){
  const data = {
    pos: pos,
    selected: selected,
    gameOver: gameOver,
    logs: logs
  };
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

// 新增紀錄條目
function addLog(msg){
  const time = new Date().toLocaleTimeString('zh-TW', { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });
  logs.unshift(`[${time}] ${msg}`);
  if(logs.length > 20) logs.pop(); // 最多留 20 條紀錄
  renderLogs();
}

function renderLogs(){
  const container = document.getElementById("logs");
  if(logs.length === 0){
    container.innerHTML = '<div class="log-item">無歷史紀錄</div>';
    return;
  }
  container.innerHTML = logs.map(l => `<div class="log-item">${l}</div>`).join('');
}

function render(){
  const track = document.getElementById("track");
  track.innerHTML = "";
  
  let nums = [];
  for(let r=5; r>=0; r--){
    let row = Array.from({length:6}, (_,i) => r*6 + i + 1);
    if((5-r) % 2 === 1) row.reverse();
    nums.push(...row);
  }

  nums.forEach(n => {
    const c = document.createElement("div");
    c.className = "cell";
    if(n === 1) c.classList.add("start");
    if(n === 36) c.classList.add("finish");
    c.innerHTML = `<div class="num">${n===1 ? "START" : n===36 ? "FINISH 🏁" : "#"+n}</div>`;

    const cars = document.createElement("div");
    cars.className = "cars";
    pos.forEach((p, i) => {
      if(p === n) {
        const car = document.createElement("span");
        car.className = "car" + (p === 36 ? " winner" : "");
        car.textContent = emojis[i];
        cars.appendChild(car);
      }
    });
    c.appendChild(cars);
    track.appendChild(c);
  });

  const teams = document.getElementById("teams");
  teams.innerHTML = "";
  names.forEach((name, i) => {
    const d = document.createElement("div");
    d.className = "team" + (i === selected ? " active" : "");
    d.onclick = () => { 
      selected = i; 
      render(); 
      setStatus(`${names[i]} 已選取 🏎️`);
      saveGameData();
    };
    d.innerHTML = `<div class="teamrow"><span class="teamname">${emojis[i]} ${name}</span><span class="pos">${pos[i]}/36</span></div>`;
    teams.appendChild(d);
  });

  renderLogs();
}

function setStatus(t){ document.getElementById("status").textContent = t; }

function moveSelected(n){
  if(gameOver) return;
  const i = selected;
  const old = pos[i];
  let next = Math.min(36, old + n);
  pos[i] = next;
  
  let statusText = `${emojis[i]} ${names[i]} 前進 ${n} 格 (到達 ${next} 格)`;
  setStatus(statusText);
  addLog(statusText);

  if(specialCells.includes(next)){
    const isForward = Math.random() < 0.5;
    const randomSteps = Math.floor(Math.random() * 3) + 1;
    const delta = isForward ? randomSteps : -randomSteps;
    
    const after = Math.max(1, Math.min(36, next + delta));
    pos[i] = after;

    const specialMsg = delta > 0
      ? `🚀 觸發加速！額外前進 ${delta} 格 → 到達 ${after} 格`
      : `⚠️ 踩到油漬！後退 ${Math.abs(delta)} 格 → 到達 ${after} 格`;
    
    setTimeout(() => {
      setStatus(specialMsg);
      addLog(`${names[i]} ${specialMsg}`);
      render();
      saveGameData();
    }, 300);
  }

  if(pos[i] === 36){
    gameOver = true;
    const winMsg = `🏆 ${names[i]} WIN! 率先通過終點線！`;
    setStatus(winMsg);
    addLog(winMsg);
  }

  render();
  saveGameData();
}

function resetGame(){
  if(confirm("確定要重置比賽嗎？歷史紀錄將被清空！")){
    pos = [0,0,0,0,0,0];
    selected = 0;
    gameOver = false;
    logs = [];
    localStorage.removeItem(STORAGE_KEY);
    render();
    setStatus("比賽重置完成！請選擇一組開始 🏁");
  }
}

// 初始化遊戲
loadGameData();
render();
if(logs.length > 0){
  setStatus("已自動載入上次的比賽紀錄 🏁");
}
</script>
</body>
</html>
